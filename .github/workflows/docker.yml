name: Build and push image

# Fires when the bundle submodule POINTER file changes on main (a new bundle
# release has been pinned) or when this workflow file itself is updated.
#
# Note: pushes made by github-actions[bot] via GITHUB_TOKEN do not re-trigger
# other workflows (GitHub prevents that loop).  So this workflow will NOT fire
# automatically after bundle.yml updates the pointer — trigger it via
# workflow_dispatch or include a hand-authored change to main/bundle.

on:
  push:
    branches: [main]
    paths:
      - bundle                           # submodule pointer — changes when a new bundle commit is pinned
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
